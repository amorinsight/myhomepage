media:
  input: assets/images
  output: /myhomepage/assets/images

content:
  - name: philosophy
    label: "철학 게시판"
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"

    view:
      primary: title
      fields: [title, category]

    fields:
      - name: title
        label: "글 제목"
        type: string
        required: true

      - name: layout
        type: string
        default: post
        hidden: true

      - name: category
        label: "카테고리"
        type: select
        default: philosophy
        options:
          values:
            - name: philosophy
              label: "철학"

      - name: body
        label: "본문"
        type: rich-text
        options:
          format: markdown
          switcher: false

settings:
  content:
    merge: true
